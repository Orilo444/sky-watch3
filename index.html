<title>Sky Watch – Adelaide Airport</title>
<style>
:root{--bg:#f1f4f7;--text:#1b2733;--muted:#5d6b78;--card:#fff;--line:#d5dce3;--accent:#e8a800;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10161d;--text:#e6edf3;--muted:#8b9bab;--card:#1a232d;--line:#2c3947}}
:root[data-theme="dark"]{--bg:#10161d;--text:#e6edf3;--muted:#8b9bab;--card:#1a232d;--line:#2c3947}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;justify-content:space-between;padding:10px 14px;max-width:900px;margin:0 auto}
h1{font-size:17px;margin:0}
.ctl{display:flex;gap:10px;align-items:center;color:var(--muted);font-size:13px}
select{font:inherit;color:var(--text);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:4px 8px}
#wrap{position:relative;margin:0 auto;width:min(100%,calc((100vh - 64px)*0.7004));border-radius:12px;overflow:hidden;border:1px solid var(--line)}
canvas{display:block;width:100%}
#info{position:absolute;left:8px;right:8px;bottom:8px;background:var(--card);color:var(--text);border:1px solid var(--line);border-radius:12px;padding:12px 14px;box-shadow:0 4px 18px rgba(0,0,0,.25);display:none}
#info .top{display:flex;justify-content:space-between;align-items:flex-start}
.call{font-size:20px;font-weight:700}.air{color:var(--muted);font-size:13px}
.tag{font-size:12px;font-weight:600;background:var(--accent);color:#2b2000;border-radius:999px;padding:2px 9px;display:inline-block;margin-top:3px}
#x{border:0;background:none;color:var(--muted);font-size:22px;line-height:1;cursor:pointer;padding:0 2px}
.route{display:flex;justify-content:space-between;align-items:center;margin:8px 0 4px}
.route b{font-size:18px}.route small{display:block;color:var(--muted);font-size:12px}
.bar{height:5px;background:var(--line);border-radius:3px;overflow:hidden;margin:4px 0 8px}.bar i{display:block;height:100%;background:var(--accent)}
dl{display:grid;grid-template-columns:repeat(2,1fr);gap:2px 16px;margin:0;font-size:13px}
dl div{display:flex;justify-content:space-between}dt{color:var(--muted)}dd{margin:0}
.hint{position:absolute;top:8px;left:50%;transform:translateX(-50%);background:rgba(20,28,36,.75);color:#fff;font-size:12px;padding:4px 10px;border-radius:999px;pointer-events:none}
</style>
</head>

function ray(p,ang){const dx=Math.sin(rad(ang)),dy=-Math.cos(rad(ang));let t=0;while(t<3000){const x=p[0]+dx*t,y=p[1]+dy*t;if(out(x,y))return[x,y];t+=4}return p}
const angDiff=(a,b)=>Math.abs(((a-b+540)%360)-180);
const near=a=>CITIES.reduce((m,c)=>angDiff(c[2],a)<angDiff(m[2],a)?c:m);
const ADL={code:"ADL",city:"Adelaide"};

function makePath(kind){
  const o={};let pts,kf;
  if(kind==="arr"){
    const c=R(CITIES),[T,E]=Math.random()<.5?[RA,RB]:[RB,RA];
    const L=Math.hypot(E[0]-T[0],E[1]-T[1]),d=[(E[0]-T[0])/L,(E[1]-T[1])/L];
    const P=[T[0]-d[0]*280,T[1]-d[1]*280];
    const back=(Math.atan2(-d[0],d[1])*180/Math.PI+360)%360; // bearing pointing back along approach
    pts=out(P[0],P[1],0)?[ray(T,back),T,E]:[ray(P,c[2]+rnd(-8,8)),P,T,E];
    o.from={code:c[0],city:c[1]};o.to=ADL;o.rwy=T===RA?"05":"23";o.status="Arriving";o.lT=pts.length-2;
  }else if(kind==="dep"){
    const c=R(CITIES),[S,E]=Math.random()<.5?[RA,RB]:[RB,RA];
    const L=Math.hypot(E[0]-S[0],E[1]-S[1]),d=[(E[0]-S[0])/L,(E[1]-S[1])/L];
    const Q=[E[0]+d[0]*300,E[1]+d[1]*300],fwd=(Math.atan2(d[0],-d[1])*180/Math.PI+360)%360;
    pts=out(Q[0],Q[1],0)?[S,E,ray(E,fwd)]:[S,E,Q,ray(Q,c[2]+rnd(-8,8))];
    o.from=ADL;o.to={code:c[0],city:c[1]};o.rwy=S===RA?"05":"23";o.status="Departing";
  }else{
    const a=rnd(0,360),off=rnd(-220,220),ox=C[0]+Math.cos(rad(a))*off,oy=C[1]+Math.sin(rad(a))*off,m=[ox,oy];
    pts=[ray(m,a),ray(m,a+180)];
    const f=near(a),t=near(a+180);o.from={code:f[0],city:f[1]};o.to={code:t[0],city:t[1]};o.status="Overflight";o.rwy="–";
  }
  o.pts=pts;o.cum=[0];for(let i=1;i<pts.length;i++)o.cum.push(o.cum[i-1]+Math.hypot(pts[i][0]-pts[i-1][0],pts[i][1]-pts[i-1][1]));
  o.total=o.cum[o.cum.length-1];
  const tot=o.total;
  if(kind==="arr"){const lT=o.cum[o.lT];kf=[[0,285,2.7*lT],[lT,230,0],[tot,40,0]]}
  else if(kind==="dep"){const rw=o.cum[1],m=Math.min(rw+250,(rw+tot)/2);kf=[[0,0,0],[rw*.6,230,0],[rw,285,0],[m,330,1800],[tot,460,Math.min(6000,rw*0+tot*6)]]}
  else{const al=Math.round(rnd(70,110))*100;kf=[[0,rnd(420,480),al],[tot,450,al]]}
  o.kf=kf;return o;
}
function kfAt(kf,s){if(s<=kf[0][0])return kf[0];for(let i=1;i<kf.length;i++)if(s<=kf[i][0]){const a=kf[i-1],b=kf[i],f=(s-a[0])/((b[0]-a[0])||1);return[s,a[1]+(b[1]-a[1])*f,a[2]+(b[2]-a[2])*f]}return kf[kf.length-1]}
function posAt(p){let i=1;while(i<p.cum.length-1&&p.s>p.cum[i])i++;const a=p.pts[i-1],b=p.pts[i],f=(p.s-p.cum[i-1])/((p.cum[i]-p.cum[i-1])||1);return{x:a[0]+(b[0]-a[0])*f,y:a[1]+(b[1]-a[1])*f,h:Math.atan2(b[1]-a[1],b[0]-a[0])}}
function spawn(kind,rand){
  kind=kind||(()=>{const r=Math.random();return r<.4?"arr":r<.75?"dep":"fly"})();
  const al=R(AIRLINES),p=Object.assign({kind,airline:al[0],call:al[1]+Math.floor(rnd(100,999)),type:R(TYPES),s:0},makePath(kind));
  if(rand)p.s=p.total*rnd(0,.85);
  planes.push(p);
}
const planes=[];const TARGET=14;
for(let i=0;i<TARGET;i++)spawn(null,true);

const cv=document.getElementById("c"),ctx=cv.getContext("2d"),info=document.getElementById("info");
let W=0,H=0,k=1,sel=null;
function resize(){W=cv.parentElement.clientWidth;k=W/MW;H=Math.round(MH*k);const d=devicePixelRatio||1;cv.width=W*d;cv.height=H*d;cv.style.height=H+"px";ctx.setTransform(d,0,0,d,0,0)}
addEventListener("resize",resize);resize();

const PLANE=new Path2D("M0,-12 C1.5,-12 2,-9 2,-6 L2,-3 L11,3 L11,5.5 L2,3 L2,8 L5,10.5 L5,12 L0,10.5 L-5,12 L-5,10.5 L-2,8 L-2,3 L-11,5.5 L-11,3 L-2,-3 L-2,-6 C-2,-9 -1.5,-12 0,-12 Z");
function draw(){
  ctx.clearRect(0,0,W,H);
  if(img.complete&&img.naturalWidth)ctx.drawImage(img,0,0,W,H);else{ctx.fillStyle="#e8eef3";ctx.fillRect(0,0,W,H)}
  if(sel){ctx.strokeStyle="#e5484d";ctx.lineWidth=2;ctx.setLineDash([6,6]);ctx.beginPath();sel.pts.forEach((q,i)=>i?ctx.lineTo(q[0]*k,q[1]*k):ctx.moveTo(q[0]*k,q[1]*k));ctx.stroke();ctx.setLineDash([])}
  [...planes].sort((a,b)=>kfAt(a.kf,a.s)[2]-kfAt(b.kf,b.s)[2]).forEach(p=>{
    const q=posAt(p);ctx.save();ctx.translate(q.x*k,q.y*k);
    if(p===sel){ctx.strokeStyle="#e5484d";ctx.lineWidth=2.5;ctx.beginPath();ctx.arc(0,0,26*Math.max(k,.7),0,7);ctx.stroke()}
    ctx.rotate(q.h+Math.PI/2);const sc=Math.max(k,.7)*1.5;ctx.scale(sc,sc);
    ctx.shadowColor="rgba(0,0,0,.35)";ctx.shadowBlur=4;ctx.shadowOffsetY=2;
    ctx.fillStyle="#ffc400";ctx.fill(PLANE);ctx.shadowColor="transparent";
    ctx.strokeStyle="#6b5200";ctx.lineWidth=1;ctx.stroke(PLANE);ctx.restore()});
}
function panel(){
  if(!sel){info.style.display="none";return}
  const p=sel,[,v,alt]=kfAt(p.kf,p.s),h=Math.round((posAt(p).h*180/Math.PI+450)%360);
  info.style.display="block";
  info.innerHTML=`<div class="top"><div><div class="call">${p.call}</div><div class="air">${p.airline} · ${p.type}</div><span class="tag">${p.status}</span></div><button id="x" aria-label="Close">×</button></div>
  <div class="route"><div><b>${p.from.code}</b><small>${p.from.city}</small></div><span>→</span><div style="text-align:right"><b>${p.to.code}</b><small>${p.to.city}</small></div></div>
  <div class="bar"><i style="width:${Math.min(100,p.s/p.total*100).toFixed(1)}%"></i></div>
  <dl><div><dt>Altitude</dt><dd>${(Math.round(alt/50)*50).toLocaleString()} ft</dd></div><div><dt>Speed</dt><dd>${Math.round(v)} km/h</dd></div><div><dt>Heading</dt><dd>${String(h).padStart(3,"0")}°</dd></div><div><dt>Runway</dt><dd>${p.rwy}</dd></div></dl>`;
  document.getElementById("x").onclick=()=>{sel=null;panel()};
}
function pick(e){const r=cv.getBoundingClientRect(),mx=e.clientX-r.left,my=e.clientY-r.top;let b=null,bd=28;
  planes.forEach(p=>{const q=posAt(p),d=Math.hypot(q.x*k-mx,q.y*k-my);if(d<bd){bd=d;b=p}});return b}
cv.addEventListener("click",e=>{sel=pick(e);document.getElementById("hint").style.display="none";panel()});
cv.addEventListener("mousemove",e=>{cv.style.cursor=pick(e)?"pointer":"default"});

let last=performance.now(),acc=0;
function loop(now){
  const dt=Math.min(.1,(now-last)/1000);last=now;const ts=+document.getElementById("speed").value;
  for(let i=planes.length-1;i>=0;i--){const p=planes[i],v=Math.max(kfAt(p.kf,p.s)[1],35);p.s+=v/3.6/PXM*ts*dt;
    if(p.s>=p.total){if(p===sel){sel=null;panel()}planes.splice(i,1)}}
  while(planes.length<TARGET)spawn();
  document.getElementById("count").textContent=planes.length+" aircraft nearby";
  draw();acc+=dt;if(acc>.2){acc=0;if(sel)panel()}
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
